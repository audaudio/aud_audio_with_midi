name: aud_audio_with_midi
description: "MIDI bridge of the Audanika Audio Engine: aud_midi ports as event inlets and outlets of the graph"
version: 1.0.1
publish_to: none
homepage: https://github.com/audaudio/aud_audio_with_midi
repository: https://github.com/audaudio/aud_audio_with_midi

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

workspace:
  - example

dependencies:
  ffi: ^2.2.0
  aud_audio_core:
    git:
      url: git@github.com:audaudio/aud_audio_core.git
      tag_pattern: "{{version}}"
    version: ^1.0.0
  aud_audio_graph:
    git:
      url: git@github.com:audaudio/aud_audio_graph.git
      tag_pattern: "{{version}}"
    version: ^1.0.0
  aud_audio:
    git:
      url: git@github.com:audaudio/aud_audio.git
      tag_pattern: "{{version}}"
    version: ^1.0.0
  aud_midi: ^1.0.0
  aud_midi_core: ^1.0.0
  aud_midi_standard: ^1.0.0
  code_assets: ^2.2.0
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.6
  flutter:
    sdk: flutter

dev_dependencies:
  dna_audanika: ^0.1.0
  ffigen: ^23.0.0
  flutter_lints: ^6.0.0
  # Within the test_api that flutter_test of the example pins.
  test: ^1.32.0